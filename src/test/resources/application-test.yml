spring:
  datasource:
    url: jdbc:h2:mem:stockflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Dùng thư mục riêng của H2 để không nạp trùng migration PostgreSQL từ main resources.
    locations: filesystem:src/test/resources/db/migration

app:
  mail:
    # All external delivery is mocked; developer environment keys must not select Brevo.
    provider: smtp
    brevo-api-key: ""
    order-notifications-enabled: false
  # Test gọi tác vụ hết hạn chủ động để kiểm soát thời gian và không đua với scheduler nền.
  orders:
    expiry:
      enabled: false
  security:
    jwt:
      secret: stockflow-test-secret-key-with-at-least-thirty-two-characters
      expiration-ms: 3600000
