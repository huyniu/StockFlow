stockflow:
  contact:
    zalo-url: ${ZALO_CONTACT_URL:https://zalo.me/0968935896}

ghn:
  base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/}
  production: ${GHN_PRODUCTION:false}
  token: ${GHN_TOKEN:MOCK_TOKEN}
  shop-id: ${GHN_SHOP_ID:123456}
  from-district-id: ${GHN_FROM_DISTRICT_ID:1450}
  sender-phone: ${GHN_SENDER_PHONE:}

server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: stockflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stockflow}
    # Đồng bộ mặc định local với PostgreSQL trong Docker Compose.
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD:stockflow_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    jwt:
      # Môi trường thông thường phải cung cấp secret; profile demo có giá trị mẫu riêng.
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}

vnpay:
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
  hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY2026}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
  storefront-url: ${VNPAY_STOREFRONT_URL:http://localhost:8080/}
  version: 2.1.0
  command: pay

---
# Test dùng console OTP, không kết nối Gmail hay yêu cầu credential SMTP.
spring:
  config:
    activate:
      on-profile: "!test & !postgres-test"
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  mail:
    from: ${APP_MAIL_FROM:${MAIL_USERNAME:no-reply@stockflow.com}}
