spring:
  application:
    name: stockflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:stockflow}
    # Đồng bộ mặc định local với PostgreSQL trong Docker Compose.
    username: ${DB_USERNAME:stockflow}
    password: ${DB_PASSWORD:stockflow_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Môi trường thông thường phải cung cấp secret; profile demo có giá trị mẫu riêng.
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}

---
# Test dùng console OTP, không kết nối Gmail hay yêu cầu credential SMTP.
spring:
  config:
    activate:
      on-profile: "!test & !postgres-test"
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  mail:
    from: ${APP_MAIL_FROM:${MAIL_USERNAME}}
