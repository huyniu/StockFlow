<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Xanh dương là màu nhận diện; theme.js đồng bộ thanh trình duyệt theo chế độ sáng/tối. -->
        <meta name="theme-color" content="#2563eb" />
        <meta
            name="description"
            content="StockFlow Tech — Điện thoại, laptop và phụ kiện công nghệ. Chọn chi nhánh, đặt hàng và theo dõi giao hàng."
        />
        <title>StockFlow Tech — Cửa hàng công nghệ & Cổng quản trị</title>
        <!-- Nạp lựa chọn sáng/tối trước CSS để tránh chớp nền sáng khi đã chọn chế độ tối. -->
        <script src="/assets/theme.js"></script>
        <script>if (['/login','/register'].includes(location.pathname)) document.documentElement.dataset.authRoute = 'true';</script>
        <!-- Font Inter hỗ trợ tiếng Việt; font hệ thống dự phòng giữ giao diện sử dụng được khi mất mạng. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet" />
        <link rel="icon" href="/assets/stockflow.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="stylesheet" href="/assets/theme.css" />
        <link rel="stylesheet" href="/assets/ui-polish.css" />
        <script src="/assets/login-artwork.js" defer></script>
        <script src="/assets/password-reset.js" defer></script>
        <script src="/assets/shipment-ui.js" defer></script>
        <script src="/app.js" type="module"></script>
    </head>
    <body>
        <noscript>Vui lòng bật JavaScript để sử dụng StockFlow.</noscript>
        <p id="boot-status" role="status">Đang mở StockFlow…</p>
        <template data-fragment="/assets/fragments/chrome.html"></template>
        <template data-fragment="/assets/fragments/auth-page.html"></template>
        <template data-fragment="/assets/fragments/icons.html"></template>
        <template data-fragment="/assets/fragments/storefront.html"></template>
        <template data-fragment="/assets/fragments/dashboard.html"></template>
        <template data-fragment="/assets/fragments/dialogs.html"></template>
        <template data-fragment="/assets/fragments/aftercare.html"></template>
    </body>
</html>
