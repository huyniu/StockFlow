# Kiểm thử Java 17 khi push hoặc mở PR vào main; không cần secret hay database bên ngoài.
name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Repo tạo trên Windows có thể chưa lưu executable bit của mvnw.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Run all integration tests
        run: ./mvnw test
      # Test đã chạy ở bước trước; bước này tạo JAR có thể tải về từ trang Actions.
      - name: Package executable JAR
        run: ./mvnw --batch-mode -DskipTests package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-java17
          path: target/stockflow-*.jar
          if-no-files-found: error
