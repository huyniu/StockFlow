# Kiểm thử Java 17 trên master/main; không cần secret hay database bên ngoài.
name: Java CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    # Ghim bản Ubuntu để việc đổi nhãn latest không tự thay môi trường kiểm chứng.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Repo tạo trên Windows có thể chưa lưu executable bit của mvnw.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Run all integration tests
        run: ./mvnw test
      # Fail rõ nếu Docker không hoạt động; không âm thầm bỏ qua kiểm chứng PostgreSQL và ledger trigger.
      - name: Check Docker for PostgreSQL tests
        run: docker info
      - name: Verify PostgreSQL migrations and concurrency
        run: ./mvnw --batch-mode -Ppostgres-tests verify
      # Test H2 và PostgreSQL đã chạy; bước này tạo JAR có thể tải về từ trang Actions.
      - name: Package executable JAR
        run: ./mvnw --batch-mode -DskipTests package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-java17
          path: target/stockflow-*.jar
          if-no-files-found: error
