# Khởi chạy PostgreSQL và ứng dụng demo bằng docker compose up --build.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stockflow}
      POSTGRES_USER: ${DB_USERNAME:-stockflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockflow_local_password}
    ports:
      # Cổng 5433 cho Maven local; ứng dụng trong Docker dùng cổng nội bộ 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      # Demo tự nạp catalog và tồn ban đầu; false để giữ chế độ nhập thủ công.
      DEMO_SEED_CATALOG: ${DEMO_SEED_CATALOG:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockflow}
      DB_USERNAME: ${DB_USERNAME:-stockflow}
      DB_PASSWORD: ${DB_PASSWORD:-stockflow_local_password}
      JWT_SECRET: ${JWT_SECRET:-stockflow-demo-secret-for-local-use-only-2026}

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-${MAIL_USERNAME:-}}

      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-DEMOVNPAY}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-DEMOHASHSECRETKEY2026}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay/return}
      VNPAY_STOREFRONT_URL: ${VNPAY_STOREFRONT_URL:-http://localhost:8080/}

      GHN_TOKEN: ${GHN_TOKEN:-MOCK_TOKEN}
      ZALO_CONTACT_URL: ${ZALO_CONTACT_URL:-https://zalo.me/0968935896}
      GHN_BASE_URL: ${GHN_BASE_URL:-https://dev-online-gateway.ghn.vn/shiip/public-api/}
      GHN_PRODUCTION: ${GHN_PRODUCTION:-false}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-123456}
      GHN_FROM_DISTRICT_ID: ${GHN_FROM_DISTRICT_ID:-1450}
      GHN_SENDER_PHONE: ${GHN_SENDER_PHONE:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      # Chờ database sẵn sàng trước khi Flyway và demo runner chạy.
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
