# Khởi chạy PostgreSQL và ứng dụng demo bằng docker compose up --build.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-stockflow}
      POSTGRES_USER: ${DB_USERNAME:-stockflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockflow_local_password}
    ports:
      # Cổng 5433 cho Maven local; ứng dụng trong Docker dùng cổng nội bộ 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      # Mặc định nhập catalog thủ công; bật true để nạp fixture sản phẩm/tồn cho portfolio.
      DEMO_SEED_CATALOG: ${DEMO_SEED_CATALOG:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockflow}
      DB_USERNAME: ${DB_USERNAME:-stockflow}
      DB_PASSWORD: ${DB_PASSWORD:-stockflow_local_password}
      JWT_SECRET: ${JWT_SECRET:-stockflow-demo-secret-for-local-use-only-2026}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      # Chờ database sẵn sàng trước khi Flyway và demo runner chạy.
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
